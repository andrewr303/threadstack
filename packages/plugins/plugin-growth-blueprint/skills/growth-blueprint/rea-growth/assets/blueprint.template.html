<!doctype html>
<!--
  rea-growth blueprint page. Rendered by scripts/blueprint.py render (data goes in #blueprint-data).

  Query parameters (all optional; combine with &):
    ?series=<id>   open on the chart series with that id (default: chart.default, else the first).
                   Annotations and windows bound to a series ("series": "<id>") are drawn only
                   while that series is shown, so open each series to check them.
    ?tab=<n>       open channel tab n (0-based).
    ?theme=dark    force the dark theme (or light); otherwise the saved choice, then the system setting.
    ?audit=1       after layout, write a JSON self-check of the shown series into a hidden
                   pre#bp-audit (and postMessage {bpAudit} to a parent frame): label collisions,
                   labels on the curve, overflow, broken images, horizontal scroll.
    ?audit=all     the same, for every series in turn: top-level label lists name the series
                   ("[id] label"), annRendered/annDropped are totals, and bySeries holds each
                   series' own chart audit. Use with ?series= to pick the series left showing.
    ?data=<url>    load blueprint JSON from an http(s) or relative URL instead of the embedded data.
  Headless Chrome will not go below 500px wide: for a phone check, load the page in a 390px iframe
  and read the {bpAudit} message.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Growth blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script>
/* Theme before first paint: ?theme= wins, then the saved choice, else the system setting (CSS). */
(function () {
  var t = null;
  try { t = new URLSearchParams(location.search).get('theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') { t = null; try { t = localStorage.getItem('bp-theme'); } catch (e) {} }
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{
  --bg:#FBFAF8;--card:#FFFFFF;--panel:#FFFFFF;--tile:#F5F4F1;--tile-2:#EEECE7;
  --line:#E9E7E2;--line-2:#DCD9D2;
  --ink:#111111;--ink-2:#2C2A26;--muted:#6E6A62;--faint:#A29D93;
  --green:#11845A;--green-ink:#0D7550;--green-soft:rgba(17,132,90,.09);--green-fill:rgba(17,132,90,.15);--green-line:rgba(17,132,90,.42);
  --mark:#C8F1DA;--amber:#87520A;--amber-soft:rgba(196,129,30,.14);
  --dark:#18171C;--dark-ink:#F7F6F2;--dark-muted:#A9A49B;
  --on-green:#FFFFFF;
  --ic-ink:#111111;--ic-paper:#FFFFFF;--ic-wayback:#6B5A3E;--ic-news:#3A4250;--ic-web:#5B6B7A;
  --shadow:0 1px 1px rgba(24,20,12,.03),0 22px 44px -26px rgba(24,20,12,.16);
  --shadow-sm:0 1px 2px rgba(24,20,12,.07);
  --r-card:28px;--r-tile:22px;--r-sm:14px;
  --f-head:"Inter Tight",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16151A;--card:#211F26;--panel:#2A2830;--tile:#1B1A20;--tile-2:#26242C;
    --line:#302D36;--line-2:#3D3A44;
    --ink:#F3F1EC;--ink-2:#DAD6CE;--muted:#A39E95;--faint:#7A756D;
    --green:#3DBA7E;--green-ink:#5CCB94;--green-soft:rgba(61,186,126,.11);--green-fill:rgba(61,186,126,.18);--green-line:rgba(61,186,126,.5);
    --mark:rgba(61,186,126,.30);--amber:#E0A84F;--amber-soft:rgba(224,168,79,.14);
    --dark:#0D0C10;--dark-ink:#F7F6F2;--dark-muted:#A9A49B;
    --on-green:#0B1F15;
    --ic-ink:#F3F1EC;--ic-paper:#111111;--ic-wayback:#C9B48F;--ic-news:#C3CAD6;--ic-web:#A9B6C2;
    --shadow:0 1px 1px rgba(0,0,0,.2),0 22px 44px -26px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16151A;--card:#211F26;--panel:#2A2830;--tile:#1B1A20;--tile-2:#26242C;
  --line:#302D36;--line-2:#3D3A44;
  --ink:#F3F1EC;--ink-2:#DAD6CE;--muted:#A39E95;--faint:#7A756D;
  --green:#3DBA7E;--green-ink:#5CCB94;--green-soft:rgba(61,186,126,.11);--green-fill:rgba(61,186,126,.18);--green-line:rgba(61,186,126,.5);
  --mark:rgba(61,186,126,.30);--amber:#E0A84F;--amber-soft:rgba(224,168,79,.14);
  --dark:#0D0C10;--dark-ink:#F7F6F2;--dark-muted:#A9A49B;
  --on-green:#0B1F15;
  --ic-ink:#F3F1EC;--ic-paper:#111111;--ic-wayback:#C9B48F;--ic-news:#C3CAD6;--ic-web:#A9B6C2;
  --shadow:0 1px 1px rgba(0,0,0,.2),0 22px 44px -26px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1200px;margin:0 auto;padding:36px 32px 72px}
.loading,.fatal{font-family:var(--f-mono);color:var(--muted);padding:40px 0}
.fatal{color:#B42318;white-space:pre-wrap}
h1,h2,h3,h4{font-family:var(--f-head);letter-spacing:-.03em;font-weight:700;line-height:1.08;margin:0;color:var(--ink)}
.kicker{font:500 11px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.sec{margin-top:56px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h2{font-size:clamp(26px,3.2vw,34px)}
.sec-h .lead{margin:8px 0 0;color:var(--muted);max-width:640px}

/* header */
.top{padding-bottom:6px}
.brandrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:34px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand .logo{width:30px;height:30px;border-radius:9px;object-fit:cover;flex:none}
.brand b{font:700 16px var(--f-head);letter-spacing:-.02em}
.brand .dom{font:400 12px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.pill.example{background:var(--amber-soft);color:var(--amber)}
.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm);color:var(--ink)}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px}
.top h1{font-size:clamp(36px,6vw,64px);max-width:15ch}
.lede{margin:18px 0 0;font-size:17px;color:var(--ink-2);max-width:62ch;overflow-wrap:anywhere}
.lede b{font-weight:600}
.lede .mono{font-size:14px}

/* hero chart card */
.hero{padding:26px 26px 22px}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;padding:0 4px}
.hero-head h2{font-size:28px}
.hero-head .sub{margin:6px 0 0;font:400 12.5px var(--f-mono);color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:4px;background:var(--tile);border:1px solid var(--line);border-radius:22px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font:500 13px var(--f-body);color:var(--muted);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg button>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg .sl-s{display:none}
.swipe{display:none;margin:4px 4px 8px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.stage-scroll{position:relative}
.stage{position:relative}
.chart{position:relative}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .ylab,.chart .xlab{font:500 11px var(--f-mono);fill:var(--muted);letter-spacing:.04em}
.chart .xtick{stroke:var(--line-2)}
.chart .area{fill:url(#bpFill)}
.chart .stop-a{stop-color:var(--green);stop-opacity:.24}
.chart .stop-b{stop-color:var(--green);stop-opacity:0}
.chart .line{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .line.partial{stroke-dasharray:5 6;stroke-width:2.25}
.chart .win{fill:var(--green-soft);stroke:var(--green-line);stroke-width:1;stroke-dasharray:3 4}
.chart .winlab{font:600 11px var(--f-mono);fill:var(--green-ink);letter-spacing:.06em}
.chart .ann{cursor:pointer;text-decoration:none;pointer-events:all}
.chart .hov{pointer-events:none}
.chart .ann line{stroke:var(--ink);stroke-width:1}
.chart .ann circle{fill:var(--card);stroke:var(--ink);stroke-width:1.75}
.chart .ann text{font:600 12px var(--f-mono);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.chart .ann:hover text,.chart .ann:focus text{fill:var(--green-ink)}
.chart .ann.dropped circle{stroke:var(--muted)}
.chart .hov line{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3;opacity:.5}
.chart .hov circle{fill:var(--green);stroke:var(--card);stroke-width:2}
.chart .empty{font:500 13px var(--f-mono);fill:var(--muted)}
.hair{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--green);pointer-events:none;opacity:0;transition:opacity .12s;z-index:4}
.hair.on{opacity:.9}
.hair span{position:absolute;top:4px;left:6px;font:600 10.5px var(--f-mono);letter-spacing:.06em;color:var(--on-green);background:var(--green);border-radius:6px;padding:2px 6px;white-space:nowrap}
.hair.flip span{left:auto;right:6px}
.lanes{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.lane{position:relative;background:var(--tile);border-radius:18px;min-height:52px}
.lane-title{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:3px}
.lane-name{font:600 13.5px/1.2 var(--f-head);letter-spacing:-.01em;color:var(--ink)}
.lane-note{font:400 10.5px/1.35 var(--f-mono);color:var(--muted)}
.lane-count{font:500 10.5px var(--f-mono);color:var(--muted)}
.lane-pin{display:none}
.chip{position:absolute;top:0;left:0;height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 11px 0 4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:500 12.5px/1 var(--f-body);color:var(--ink);white-space:nowrap;text-decoration:none;box-shadow:var(--shadow-sm);z-index:1;transition:border-color .12s,box-shadow .12s}
.chip:hover,.chip:focus-visible{border-color:var(--green);z-index:3;box-shadow:0 0 0 3px var(--green-soft)}
.chip .ib{width:20px;height:20px;border-radius:999px;background:var(--tile);display:grid;place-items:center;flex:none;overflow:hidden}
.chip .ib svg{width:14px;height:14px}
.chip .ib img{width:20px;height:20px;object-fit:cover;border-radius:999px}
.chip .cl{overflow:hidden;text-overflow:ellipsis;max-width:260px}
.chip.hl{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:600}
.chip.hl .ib{background:#fff}
:root[data-theme="dark"] .chip .ib{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip .ib{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}}
.chip.hl:hover,.chip.hl:focus-visible{box-shadow:0 0 0 3px var(--green-fill)}
.chip.inf{border-style:dashed}
.chip.hl.inf{border-style:solid}
.hero-foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;margin:16px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.legend i{display:inline-block;width:18px;height:10px;border-radius:999px;vertical-align:-1px;margin-right:6px}
.legend .lg-hl{background:var(--green)}
.legend .lg-mv{background:var(--panel);border:1px solid var(--line-2)}
.legend .lg-win{background:var(--green-soft);border:1px dashed var(--green-line);border-radius:4px}
.src{font:500 11px/1.5 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.src a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-2)}
.src a:hover{color:var(--green-ink);border-color:var(--green)}
.leaves{margin:10px 4px 0;color:var(--muted);font-size:13px}

/* tooltip */
.tip{position:fixed;z-index:50;max-width:300px;background:var(--dark);color:var(--dark-ink);border-radius:14px;padding:10px 12px;font:400 12.5px/1.45 var(--f-body);box-shadow:0 18px 40px -16px rgba(0,0,0,.45);pointer-events:none}
.tip[hidden]{display:none}
.tip .td{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dark-muted);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.tip b{font-weight:600}
.tip .tag{margin-left:auto}

/* tags */
.tag{display:inline-flex;align-items:center;font:600 11px/1 var(--f-mono);letter-spacing:.06em;padding:4px 7px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.tag.seen{color:var(--green-ink);background:var(--green-soft)}
.tag.inferred{color:var(--amber);background:var(--amber-soft)}
.tip .tag.seen{color:#7EE0AE;background:rgba(61,186,126,.18)}
.tip .tag.inferred{color:#F0C27A;background:rgba(224,168,79,.18)}

/* channel showcase */
.tabs{display:inline-flex;flex-wrap:wrap;gap:3px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-sm);max-width:100%}
.tabs button{border:0;background:transparent;border-radius:999px;padding:9px 16px 9px 10px;font:500 14px var(--f-body);color:var(--muted);display:inline-flex;align-items:center;gap:9px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .cnt{font:500 11px var(--f-mono);color:var(--muted)}
.tabs button[aria-selected="true"] .cnt{color:inherit}
.icons{display:inline-flex}
.icons .ic-b{width:22px;height:22px;border-radius:999px;background:var(--panel);border:1.5px solid var(--card);display:grid;place-items:center;margin-left:-6px;box-shadow:var(--shadow-sm)}
.icons .ic-b:first-child{margin-left:0}
.tabs button[aria-selected="true"] .ic-b{border-color:var(--ink)}
.icons svg{width:14px;height:14px}
.takeaway{margin:22px 2px 18px;font:500 13.5px/1.5 var(--f-mono);color:var(--green-ink);overflow-wrap:anywhere}
.ev-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;min-width:0}
@supports (grid-template-rows:subgrid){.ev{display:grid;grid-row:span 3;grid-template-rows:subgrid;grid-template-columns:minmax(0,1fr);row-gap:0}.ev-foot{align-self:end}}
.ev-vis{background:var(--tile);border-radius:var(--r-tile);padding:20px;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.ev-body{padding:18px 12px 0}
.ev-num{font:600 12px var(--f-mono);color:var(--green);letter-spacing:.06em}
.ev-title{font-size:21px;margin-top:8px;letter-spacing:-.035em}
.ev-find{margin:10px 0 0;color:var(--ink-2);font-size:14.5px;overflow-wrap:anywhere}
.ev-find strong{font-weight:650;color:var(--ink)}
code{font:500 .86em var(--f-mono);background:var(--tile);border:1px solid var(--line);border-radius:7px;padding:1px 6px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ev-foot{margin-top:auto;padding:16px 12px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
/* one line, so the footers of a row of cards sit level; the full label is in the title */
.ev-foot a,.ev-foot span.s{display:block;flex:0 1 auto;min-width:0;font:500 10.5px/24px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-foot .tag{flex:none}
.ev-foot a:hover{color:var(--green-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);min-width:0}
a.panel{text-decoration:none;color:inherit;display:block}
a.panel:hover{border-color:var(--line-2)}

/* post */
.post{padding:14px 14px 12px}
.post-h{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:999px;object-fit:cover;flex:none;background:var(--tile-2)}
.av-i{display:grid;place-items:center;font:600 13px var(--f-head);color:var(--ink-2)}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font:600 14px/1.2 var(--f-head);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* handle (or role) gives way first; the date never truncates */
.who .meta{display:flex;min-width:0;font:400 11px/1.4 var(--f-mono);color:var(--muted);white-space:nowrap}
.who .hdl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.who .dt{flex:none;white-space:pre}
.pf{width:18px;height:18px;flex:none;align-self:flex-start}
.post-t{margin:10px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.post-m{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:var(--tile-2)}
.post-m img,.post-m .ph{width:100%;height:100%;object-fit:cover;display:block}
/* several media: a carousel strip of thumbs */
.post-c{margin-top:10px;display:grid;gap:6px}
.post-c .pc{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--tile-2);min-width:0}
.post-c img,.post-c .ph{width:100%;height:100%;object-fit:cover;display:block}
.post-c .pn{position:absolute;right:5px;bottom:5px;background:rgba(14,13,16,.74);color:#fff;border-radius:999px;padding:2px 6px;font:500 11px/1.2 var(--f-mono)}
/* a text-only post carries its words larger */
.post.no-m .post-t{font-size:15px;line-height:1.5;-webkit-line-clamp:9}
.ev-vis.v-post{justify-content:flex-start}
.post-x{margin-top:10px;font-size:11px;color:var(--muted);letter-spacing:.02em}
.post-x b{color:var(--ink);font-weight:600}

/* ads */
.ads-q{background:var(--dark);color:var(--dark-ink);border-radius:14px;padding:10px 14px;font:500 13.5px/1.4 var(--f-head);letter-spacing:-.01em}
.ads-row{display:flex;gap:8px}
.ad{position:relative;flex:1 1 0;min-width:0;margin:0;aspect-ratio:9/15;border-radius:14px;overflow:hidden;background:var(--tile-2);border:1px solid var(--line)}
.ad img,.ad .ph{width:100%;height:100%;object-fit:cover;display:block}
.ad figcaption{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(14,13,16,.74);color:#fff;border-radius:10px;padding:4px 6px;font:500 11px/1.2 var(--f-body);text-align:center;white-space:normal;overflow-wrap:anywhere}
.ads-n{display:flex;align-items:center;gap:6px;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ads-n svg{width:14px;height:14px}

/* badge */
/* windows cascade from the back (top right) to the front (bottom left). Each back window sits at least one
   chip width (86px) right of the window in front, so its bar (host) and its bottom-right chip always show. */
.fan{container-type:inline-size;margin:0 2px}
.fan-in{position:relative;height:0}
.n3 .fan-in{padding-bottom:calc(80px + min(100% - 172px, 46%) * .625)}
.n2 .fan-in{padding-bottom:calc(58px + min(100% - 86px, 58%) * .625)}
.n1 .fan-in{padding-bottom:calc(28px + 62% * .625)}
.bw{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 24px -14px rgba(0,0,0,.35)}
.bw-bar{height:22px;display:flex;align-items:center;gap:3px;padding:0 7px;border-bottom:1px solid var(--line);background:var(--tile)}
.bw-bar i{width:6px;height:6px;border-radius:50%;background:#FF5F57;flex:none}
.bw-bar i:nth-child(2){background:#FEBC2E}.bw-bar i:nth-child(3){background:#28C840}
.bw-bar span{margin-left:4px;font:500 10.5px var(--f-mono);min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-body{position:relative;aspect-ratio:16/10;background:var(--tile-2)}
.bw-body img,.bw-body .ph{width:100%;height:100%;object-fit:cover;display:block}
.bw-chip{position:absolute;right:5px;bottom:5px;max-width:calc(100% - 10px);overflow:hidden;text-overflow:ellipsis;background:var(--dark);color:#fff;border-radius:999px;padding:3px 6px;font:600 10.5px/1.2 var(--f-body);letter-spacing:-.01em;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
/* a back window shows 86px of its bottom-right corner: a chip of up to 80px (+5px inset) stays whole */
.bw:not(:last-child) .bw-chip{max-width:80px}
.bw-chip span{color:#FF6B8B}
.n3 .bw{width:min(100% - 172px, 46%)}
.n3 .bw0{right:0;top:0;z-index:1}
.n3 .bw1{right:max(86px, 27%);top:28px;z-index:2}
.n3 .bw2{left:0;top:56px;z-index:3}
.n2 .bw{width:min(100% - 86px, 58%)}
.n2 .bw0{right:0;top:0;z-index:1}
.n2 .bw1{left:0;top:30px;z-index:2}
.n1 .bw{width:62%}
.n1 .bw0{left:19%;top:0}
/* a narrow card keeps the two front windows only, so hosts stay readable */
@container (max-width:289px){
  .n3 .fan-in{padding-bottom:calc(58px + min(100% - 86px, 58%) * .625)}
  .n3 .bw0{display:none}
  .n3 .bw{width:min(100% - 86px, 58%)}
  .n3 .bw1{right:0;top:0}
  .n3 .bw2{left:0;top:30px}
}
.bigbadge{align-self:center;display:inline-flex;align-items:center;gap:10px;max-width:100%;margin-top:6px;background:var(--dark);color:var(--dark-ink);border-radius:999px;padding:8px 16px 8px 8px;font:500 14px/1.2 var(--f-head);letter-spacing:-.01em;box-shadow:0 0 0 3px var(--tile),0 0 0 5px var(--green)}
.bigbadge b{font-weight:700}
.bigbadge .bb-ic{width:26px;height:26px;border-radius:8px;object-fit:cover;flex:none}
.bigbadge .bb-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigbadge .bb-x{color:var(--dark-muted);font-weight:400;margin-left:2px}
.bnote{margin:4px 0 0;text-align:center;font:500 11px/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}

/* links */
.links{padding:8px;display:flex;flex-direction:column;gap:6px}
.lr{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:10px;padding:9px 11px;text-decoration:none;color:inherit;min-width:0}
a.lr:hover{background:var(--tile-2)}
.lr .ld{flex:1 1 auto;min-width:0;font:500 12px var(--f-mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .la{color:var(--muted);font:400 12px var(--f-mono);flex:none}
.lr .lp{font:400 12px var(--f-mono);color:var(--muted);flex:none}
.lr .lv{font:700 12px var(--f-mono);color:var(--green-ink);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ai answer */
.aip{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.aip-p{display:inline-flex;max-width:100%;background:var(--dark);color:var(--dark-muted);border-radius:999px;padding:6px 12px;font:400 11px/1.3 var(--f-mono);text-decoration:none;min-width:0}
.aip-p .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:3ch}
.aip-p b{color:var(--dark-ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
.aiq{margin:4px 0 0;font:400 11.5px/1.45 var(--f-mono);color:var(--muted)}
.air{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:4px}
.air li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;border:1.5px solid transparent;min-width:0}
.air .rk{font:600 11px var(--f-mono);color:var(--muted);width:14px;flex:none;text-align:right}
.air .ri{width:20px;height:20px;border-radius:6px;flex:none;object-fit:cover}
.air .ri-i{display:grid;place-items:center;background:var(--tile-2);font:600 11px var(--f-head);color:var(--muted)}
.air .rn{font:500 13.5px var(--f-head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.air li.tgt{border-color:var(--green);background:var(--green-soft)}
.air li.tgt .rn{font-weight:700}
.air li.tgt .rk{color:var(--green-ink)}
.air .you{margin-left:auto;font:600 11px var(--f-mono);letter-spacing:.06em;color:var(--green-ink);flex:none}

/* image / stat */
.imgv{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-sm)}
.imgv img,.imgv .ph{display:block;width:100%;height:auto;object-fit:cover}
.imgv .ph{min-height:120px}
.statv{padding:18px 18px 16px}
.statv .st-k{font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;overflow-wrap:anywhere}
.statv .sv{font:700 clamp(46px,5vw,64px)/1 var(--f-head);letter-spacing:-.05em;color:var(--green-ink);overflow-wrap:anywhere}
.statv .sl{margin-top:10px;font:500 11.5px/1.45 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.sbar{margin-top:18px;height:8px;border-radius:999px;background:var(--tile-2);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:999px;background:var(--green)}
.sbar-l{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font:500 11px/1.3 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.sbar-l span:last-child{text-align:right}

/* placeholder for missing images */
.ph{display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--tile-2) 0 8px,var(--tile) 8px 16px);color:var(--muted);font:500 10.5px/1.3 var(--f-mono);text-align:center;padding:8px;overflow:hidden}
.ph span{max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* plays */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font:600 13.5px var(--f-body);cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn svg{width:15px;height:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.done{background:var(--green);border-color:var(--green);color:var(--on-green)}
.plays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.play{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 14px;padding:24px 26px}
.play[hidden]{display:none}
.play-n{font:600 28px/1 var(--f-mono);color:var(--green);letter-spacing:-.02em;padding-top:2px}
.play h3{font-size:22px}
.play-meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:12px}
.kv{display:inline-flex;gap:6px;align-items:baseline;background:var(--tile);border-radius:999px;padding:5px 11px;font:400 12.5px var(--f-body);color:var(--ink-2);max-width:100%}
.kv i{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal;flex:none}
.stage-c{display:inline-flex;align-items:center;border-radius:999px;padding:5px 11px;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--green-soft);color:var(--green-ink)}
.stage-c.st-get-noticed{background:rgba(59,108,212,.11);color:#2F5BB8}
.stage-c.st-sign-up{background:rgba(130,80,200,.11);color:#7044B5}
.stage-c.st-pay{background:var(--amber-soft);color:var(--amber)}
.stage-c.st-share{background:rgba(214,72,120,.11);color:#B23A66}
:root[data-theme="dark"] .stage-c.st-get-noticed{color:#8EB0F5}:root[data-theme="dark"] .stage-c.st-sign-up{color:#C3A2F2}:root[data-theme="dark"] .stage-c.st-share{color:#F29BBC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage-c.st-get-noticed{color:#8EB0F5}:root:not([data-theme="light"]) .stage-c.st-sign-up{color:#C3A2F2}:root:not([data-theme="light"]) .stage-c.st-share{color:#F29BBC}}
.evl{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.evl li{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--ink-2)}
.evl li>span:last-child{min-width:0;overflow-wrap:anywhere}
.evl li .tag{flex:none;transform:translateY(-1px)}
.evl a,.method a,.skip a,.ev-find a{color:var(--green-ink);text-decoration-color:var(--green-line);text-underline-offset:2px}
.prompt{margin-top:16px;background:var(--tile);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.prompt-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.prompt-h .mono{font:500 10.5px var(--f-mono);letter-spacing:.1em;color:var(--muted)}
.prompt pre{margin:0;padding:14px;font:400 12.5px/1.6 var(--f-mono);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
.more-row{display:flex;justify-content:center;margin-top:16px}

/* the path: one cell per stage, left to right; dominant loops as pills */
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.pth{display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px;border-radius:22px;min-width:0;position:relative}
.pth-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.pth-n{font:600 12px var(--f-mono);color:var(--green);letter-spacing:.06em;flex:none}
.pth .stage-c{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 9px;font-size:10.5px}
.pth-t{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.pth-t a,.loop a,.nextl a{color:var(--green-ink);text-decoration-color:var(--green-line);text-underline-offset:2px}
.pth-f{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.pth-f a{font:500 10.5px/24px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap}
.pth-f a:hover{color:var(--green-ink)}
.pth-f .tag{flex:none}
.loops{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.loops-k{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.loop{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;max-width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px 14px;box-shadow:var(--shadow-sm);font-size:13.5px;color:var(--ink-2)}
.loop b{font:700 13.5px var(--f-head);letter-spacing:-.01em;color:var(--green-ink)}
.loop .since{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.loop>span:last-child{min-width:0;overflow-wrap:anywhere}
.nextl{padding:8px 26px}
.nextl ul{list-style:none;margin:0;padding:0}
.nextl li{display:flex;gap:12px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.nextl li:last-child{border-bottom:0}
.nextl li .tag{flex:none;transform:translateY(-1px)}
.nextl li>span.nx{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.nextl .nx-open{margin-left:6px;font:500 11px var(--f-mono);color:var(--muted);text-decoration:none;white-space:nowrap}
.nextl .nx-open:hover{color:var(--green-ink)}

/* skip, tables, method */
.skip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.skip{padding:20px 22px}
.skip h3{font-size:17px;display:flex;gap:10px;align-items:flex-start;letter-spacing:-.02em}
.skip h3 .x{flex:none;width:20px;height:20px;border-radius:999px;background:var(--tile);color:var(--muted);display:grid;place-items:center;font:600 11px var(--f-mono);margin-top:-1px}
.skip p{margin:8px 0 0 30px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.skip h3>span:last-child{min-width:0;overflow-wrap:anywhere}
details.tl{padding:6px 22px}
details.tl summary{cursor:pointer;padding:14px 0;font:600 16px var(--f-head);letter-spacing:-.02em;list-style:none;display:flex;align-items:center;gap:10px}
details.tl summary::-webkit-details-marker{display:none}
details.tl summary::before{content:"+";font:500 16px var(--f-mono);color:var(--green);width:16px}
details.tl[open] summary::before{content:"−"}
details.tl summary .mono{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px 14px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
td.mono,td .mono{font-family:var(--f-mono);font-size:12px}
td.num,th.num{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-size:12.5px}
tr.total td{font-weight:600;color:var(--ink);border-bottom:0}
.cost{padding:10px 22px 18px}
.cost td a{color:var(--green-ink)}
.ep{display:block;font:400 11.5px/1.6 var(--f-mono);color:var(--muted)}
.foot-note{margin:4px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.method{padding:22px 26px;display:flex;flex-direction:column;gap:10px}
.method p{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.leaves,.play h3,.kv{overflow-wrap:anywhere}
td{overflow-wrap:anywhere}
.tl-open{display:inline-flex;align-items:center;min-height:24px;padding:4px 6px;margin:-4px -6px;white-space:nowrap}
.footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ic{width:16px;height:16px;flex:none}

@media (max-width:999px) and (min-width:760px){
  .path{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ev-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* an odd last card spans the row: visual left, words right */
  .ev-grid>.ev:last-child:nth-child(odd){grid-column:1/-1;grid-row:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:8px}
  .ev-grid>.ev:last-child:nth-child(odd)>.ev-vis{grid-column:1;grid-row:1/span 2}
  .ev-grid>.ev:last-child:nth-child(odd)>.ev-body{grid-column:2;grid-row:1}
  .ev-grid>.ev:last-child:nth-child(odd)>.ev-foot{grid-column:2;grid-row:2}
}
@media (max-width:759px){
  .wrap{padding:20px 16px 56px}
  .brandrow{margin-bottom:24px}
  .brand .dom{display:none}
  .lede{font-size:15.5px}
  .sec{margin-top:40px}
  .hero{padding:18px 14px 16px;border-radius:24px}
  .hero-head{padding:0 2px}
  .hero-head h2{font-size:23px}
  /* series switch: one row of equal pills; a series' short_label stands in for a long label */
  .hero-head>div:first-child{min-width:0}
  .seg{display:flex;width:100%;flex-wrap:nowrap}
  .seg button{flex:1 1 0;min-width:0;justify-content:center;padding:7px 10px}
  .seg .has-s .sl-f{display:none}
  .seg .has-s .sl-s{display:block}
  .swipe{display:block}
  .stage-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:0 -14px;padding:0 14px 6px;scrollbar-width:thin}
  .ev-grid{grid-template-columns:minmax(0,1fr)}
  .ev-vis{min-height:0}
  /* one-row pill: scrolls sideways inside itself if the labels ever outgrow the phone */
  .tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;scroll-snap-type:x proximity;border-radius:999px;gap:2px;padding:4px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;justify-content:center;scroll-snap-align:start;padding:8px 12px 8px 8px;font-size:13.5px;gap:7px}
  .tabs .cnt{display:none}
  .tabs .icons>:nth-child(n+2){display:none}
  [data-act=copy-prompt],[data-act=copy-book]{min-height:40px;padding-left:16px;padding-right:16px}
  /* lanes: a pinned lane name rides along when the timeline is swiped */
  .lane-title{display:none}
  .lane-pin{display:inline-flex;align-items:center;gap:6px;position:sticky;left:0;top:0;z-index:2;margin:6px 0 0;padding:3px 12px 3px 10px;border-radius:999px;background:linear-gradient(90deg,var(--tile) 78%,transparent);font:600 11px/1.3 var(--f-head);letter-spacing:-.005em;color:var(--ink);white-space:nowrap}
  .lane-pin span{font:500 10px var(--f-mono);letter-spacing:0;color:var(--muted)}
  .play{grid-template-columns:minmax(0,1fr);padding:20px 18px}
  .play-n{font-size:20px}
  .play h3{font-size:19px}
  .prompt-h{flex-wrap:wrap}
  .method{padding:18px}
  .cost,details.tl{padding-left:14px;padding-right:14px}
  /* the path stacks: one stage per row */
  .path{grid-template-columns:minmax(0,1fr);gap:10px}
  .pth{padding:16px}
  .nextl{padding:4px 18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>

      if (SCHEME.test(p) && !/^https?:/.test(p)) { fail(new Error('?data= must be an http(s) or relative URL')); return; }
      try { BASE = new URL(src, location.href).href; } catch (e) { fail(e); return; }
      fetch(BASE).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + src); return r.json(); }).then(function (d) { try { start(d); } catch (e) { fail(e); } }).catch(fail);
      return;
    }
    var el = document.getElementById('blueprint-data'), txt = el ? el.textContent.trim() : '';
    if (!txt) { fail(new Error('no data. Render with scripts/blueprint.py render, or open with ?data=blueprint.json over http.')); return; }
    try { start(JSON.parse(txt)); } catch (e) { fail(e); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
