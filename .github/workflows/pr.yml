name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: >-
      github.repository == 'paperclipai/paperclip' &&
      (github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci')
    # Master requires CODEOWNERS review for .github/**, including this workflow.
    # The AWS runner group permits pr-trusted.yml@refs/heads/master.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@master

  threadstack:
    if: >-
      github.repository == 'AVRCORP/threadkeeper' &&
      (github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci')
    # This hard fork has its own read-only integration checks. The canonical
    # workflow and its protected lockfile-writer policy remain unchanged.
    uses: ./.github/workflows/threadstack-pr.yml
