<!doctype html><html><head><meta charset="utf-8"><title>REQ-6 cross-origin host spike</title>
<style>
html,body{margin:0;height:100%;font:16px system-ui;background:white}#view{position:fixed;inset:80px 0 0 200px;background:#e2f6ef;padding:24px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}iframe.clipped{clip-path:polygon(evenodd,0 0,100% 0,100% 100%,0 100%,0 0,200px 80px,200px 100%,100% 100%,100% 80px,200px 80px)}#log{position:fixed;bottom:12px;left:220px;pointer-events:none;background:white;max-width:70%;white-space:pre-wrap}
</style></head><body>
<main id="view"><h1>Threadkeeper view stand-in</h1><button id="underlay">Click through the clipped rectangle</button><label>Underlying editor <input id="editor"></label></main>
<iframe id="paperclip" title="Cross-origin Paperclip stand-in" src="{{frameOrigin}}"></iframe><output id="log" aria-live="polite"></output>
<script>
const frame=document.querySelector('iframe'), log=document.querySelector('output');let count=0,lastViewFocus=document.querySelector('#underlay');
function record(message){log.textContent+=message+'\n'}
document.querySelector('#underlay').addEventListener('click',()=>record('underlay click '+(++count)));
document.querySelector('#view').addEventListener('focusin',event=>{lastViewFocus=event.target});
window.addEventListener('message',event=>{if(event.origin!=='{{frameOrigin}}'||event.source!==frame.contentWindow)return;const data=event.data;if(data?.source!=='req6-spike')return;if(data.type==='clip'){frame.classList.toggle('clipped',data.enabled);record('clip '+data.enabled)}if(data.type==='overlay'){frame.classList.toggle('clipped',!data.open);if(!data.open)lastViewFocus.focus();record('overlay '+data.open+'; active element '+document.activeElement.id)}if(data.type==='record')record(data.message)});
</script></body></html>
